<div class="engineer-page">

  <!-- HEADER -->
  <div class="header">
    <h2>Incident Intelligence Platform</h2>

    <div class="header-actions">
      <span class="welcome">
        Welcome, {{ engineerName }}
      </span>

      <button mat-icon-button color="warn" (click)="logout()" matTooltip="Logout">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <div class="table-header">
      <h3>Assigned Incidents</h3>

      <!-- SEARCH -->
      <mat-form-field appearance="outline" class="search-box">
        <mat-label>Search Incident</mat-label>
        <input matInput placeholder="Enter Incident ID" (keyup)="searchIncident($event)">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>

    <!-- TABLE -->
    <mat-card>
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">

        <!-- Incident ID -->
        <ng-container matColumnDef="incidentId">
          <th mat-header-cell *matHeaderCellDef>Incident ID</th>
          <td mat-cell *matCellDef="let row">{{ row.incidentId }}</td>
        </ng-container>

        <!-- Title -->
        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef>Title</th>
          <td mat-cell *matCellDef="let row">{{ row.title }}</td>
        </ng-container>

        <!-- Priority -->
        <ng-container matColumnDef="priority">
          <th mat-header-cell *matHeaderCellDef>Priority</th>
          <td mat-cell *matCellDef="let row">{{ row.priority }}</td>
        </ng-container>

        <!-- Status -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let row">
            <span class="status" [ngClass]="row.status">
              {{ row.status }}
            </span>
          </td>
        </ng-container>

        <!-- Created -->
        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef>Created</th>
          <td mat-cell *matCellDef="let row">{{row.createdAt | date:'short'}}</td>
        </ng-container>

        <!-- HEADER & ROW -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

        <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="openIncident(row)" class="clickable-row">
        </tr>

      </table>
    </mat-card>
  </div>

</div>
