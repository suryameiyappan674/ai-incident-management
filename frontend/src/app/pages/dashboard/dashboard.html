<div class="dashboard-container">

   <div class="header">

    <h2>Incident Intelligence Dashboard</h2>

    <div class="header-actions">

        <button
            mat-raised-button
            color="primary"
            (click)="openCreateIncident()">

            <mat-icon>add</mat-icon>
            Create Incident

        </button>

        <button
            mat-icon-button
            color="warn"
            (click)="logout()"
            matTooltip="Logout">

            <mat-icon>logout</mat-icon>

        </button>

    </div>

</div>

    <div class="cards">

        <mat-card class="card total">
            <h3>Total</h3>
            <h1>{{dashboard.total}}</h1>
        </mat-card>

        <mat-card class="card pending">
            <h3>Pending</h3>
            <h1>{{dashboard.pending}}</h1>
        </mat-card>

        <mat-card class="card progress">
            <h3>In Progress</h3>
            <h1>{{dashboard.inProgress}}</h1>
        </mat-card>

        <mat-card class="card resolved">
            <h3>Resolved</h3>
            <h1>{{dashboard.resolved}}</h1>
        </mat-card>

    </div>

    <mat-card>

        <table mat-table [dataSource]="incidents">

            <ng-container matColumnDef="incidentId">
                <th mat-header-cell *matHeaderCellDef>ID</th>
                <td mat-cell *matCellDef="let row">{{row.incidentId}}</td>
            </ng-container>

            <ng-container matColumnDef="title">
                <th mat-header-cell *matHeaderCellDef>Title</th>
                <td mat-cell *matCellDef="let row">{{row.title}}</td>
            </ng-container>

            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef>Status</th>
                <td mat-cell *matCellDef="let row">{{row.status}}</td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>

    </mat-card>

</div>
